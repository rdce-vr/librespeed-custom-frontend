server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Set maximum upload body size to 50M for the upload speed test
    client_max_body_size 50M;

    # Force serving our custom index.html for root, index.php, or index.html
    location = / {
        try_files /index.html =404;
    }

    location = /index.php {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    # ==============================
    # LIBRESPEED FRONTEND ASSETS
    # ==============================

    location = /speedtest.js {
        proxy_pass http://speedtest:8080/speedtest.js;
        proxy_set_header Host $proxy_host;
    }

    location = /speedtest_worker.js {
        proxy_pass http://speedtest:8080/speedtest_worker.js;
        proxy_set_header Host $proxy_host;
    }

    location = /server-list.json {
        proxy_pass http://speedtest:8080/server-list.json;
        proxy_set_header Host $proxy_host;
    }

    location /images/ {
        proxy_pass http://speedtest:8080/images/;
        proxy_set_header Host $proxy_host;
    }

    location /fonts/ {
        proxy_pass http://speedtest:8080/fonts/;
        proxy_set_header Host $proxy_host;
    }

    location /frontend/ {
        proxy_pass http://speedtest:8080;
        proxy_set_header Host $proxy_host;
    }

    # ==============================
    # LIBRESPEED BACKEND & PHP API
    # ==============================

    # Proxy /backend/... requests directly
    location /backend/ {
        proxy_pass http://speedtest:8080;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root-level PHP fallbacks (proxied to backend/ subfolder inside container)
    location = /getIP.php {
        proxy_pass http://speedtest:8080/backend/getIP.php;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /empty.php {
        proxy_pass http://speedtest:8080/backend/empty.php;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /garbage.php {
        proxy_pass http://speedtest:8080/backend/garbage.php;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /telemetry.php {
        proxy_pass http://speedtest:8080/backend/telemetry.php;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==============================
    # CACHE & MISSING-SLASH FALLBACKS (e.g. /backendgarbage.php -> /backend/garbage.php)
    # ==============================

    location = /backendgarbage.php {
        proxy_pass http://speedtest:8080/backend/garbage.php;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /backendempty.php {
        proxy_pass http://speedtest:8080/backend/empty.php;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /backendgetIP.php {
        proxy_pass http://speedtest:8080/backend/getIP.php;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /backendtelemetry.php {
        proxy_pass http://speedtest:8080/backend/telemetry.php;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve custom files and CSS locally
    location / {
        try_files $uri $uri/ =404;
    }
}
